<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230057B8'/%3E%3Cpath d='M0 18h32v5a9 9 0 0 1-9 9H9a9 9 0 0 1-9-9z' fill='%23FFD500'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
  <title>Specialist · UAHUB</title>
</head>
<body data-page="specialist">
<main class="wrap" id="profile"></main>
<footer data-footer></footer>

<div class="sheet-backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="sheet-top">
    <div class="sheet-title">
      <button class="icon-btn" data-back aria-label="Back"><span data-icon="back"></span></button>
      <h2 id="sheet-title">Book a visit</h2>
      <button class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
    </div>
    <div class="progress"></div>
    <p class="step-label"></p>
  </div>
  <div class="sheet-body"></div>
  <div class="sheet-foot">
    <div class="sum"></div>
    <button class="btn btn-primary" data-next>Continue</button>
  </div>
</div>
<script src="data.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
